<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480, height=320, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">
  <title>Momo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!--
  #wrapper is always 480×320 in CSS pixels.
  JS scales it to fit whatever Chromium actually reports as the viewport.
-->
<div id="wrapper">

  <!-- ══════════════════════════════════════════════════════════════
       LEFT SIDEBAR — always visible, shows all features at a glance
       ══════════════════════════════════════════════════════════════ -->
  <aside id="sidebar">

    <!-- Robot face + name -->
    <div class="sb-face">&#x25D5;&#x203F;&#x25D5;</div>
    <div class="sb-name">MOMO</div>

    <div class="sb-divider"></div>

    <!-- Clock summary -->
    <div class="sb-section">
      <div class="sb-icon">&#9711;</div>
      <div id="sb-time"  class="sb-val">--:--</div>
      <div id="sb-date"  class="sb-sub">---</div>
    </div>

    <div class="sb-divider"></div>

    <!-- Weather summary -->
    <div class="sb-section">
      <div id="sb-w-icon" class="sb-icon">&#x26C5;</div>
      <div id="sb-w-temp" class="sb-val">--&deg;F</div>
      <div id="sb-w-desc" class="sb-sub">---</div>
    </div>

    <div class="sb-divider"></div>

    <!-- Task count -->
    <div class="sb-section">
      <div class="sb-icon">&#10003;</div>
      <div id="sb-tasks" class="sb-val">-- tasks</div>
    </div>

    <div class="sb-spacer"></div>

    <!-- Nav buttons -->
    <nav id="sidebar-nav">
      <button id="nav-clock"    onclick="setScreen('clock')"   class="active">Clock</button>
      <button id="nav-weather"  onclick="triggerWeather()">Weather</button>
      <button id="nav-tasks"    onclick="setScreen('tasks')">Tasks</button>
    </nav>

    <!-- Mic status dot -->
    <div id="mic-dot" title="Microphone status"></div>

  </aside>

  <!-- ══════════════════════════════════════════════════════════════
       RIGHT MAIN — detail view for the selected feature
       ══════════════════════════════════════════════════════════════ -->
  <main id="main">

    <!-- Screen: Clock -->
    <div id="clock-screen" class="screen">
      <div class="main-face">&#x25D5;&#x203F;&#x25D5;</div>
      <div id="time" class="main-time">--:--</div>
      <div id="date" class="main-date">Loading...</div>
    </div>

    <!-- Screen: Weather -->
    <div id="weather-screen" class="screen hidden">
      <div id="weather-icon" class="main-w-icon">&#x26C5;</div>
      <div id="weather-temp" class="main-w-temp">--&deg;F</div>
      <div id="weather-desc" class="main-w-desc">Loading...</div>
      <div id="weather-city" class="main-w-city">--</div>
    </div>

    <!-- Screen: Tasks -->
    <div id="tasks-screen" class="screen hidden">
      <div class="tasks-header">
        <span class="screen-label">TODAY&rsquo;S TASKS</span>
        <span id="tasks-progress" class="tasks-progress"></span>
      </div>
      <div id="tasks-list"></div>
      <button class="add-btn" onclick="showAddTask()">+ Add Task</button>
    </div>

    <!-- Voice banner — slides up from bottom of main when Momo is active -->
    <div id="voice-banner">
      <div id="banner-face"   class="banner-face">&#x25D5;&#x203F;&#x25D5;</div>
      <div id="banner-anim"   class="banner-anim"><span></span><span></span><span></span></div>
      <div id="banner-status" class="banner-status">Listening...</div>
    </div>

  </main><!-- /#main -->

</div><!-- /#wrapper -->

<!-- Add Task Modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">New Task</div>
    <input id="task-input" type="text" placeholder="What do you need to do?">
    <div class="modal-buttons">
      <button class="btn-confirm" onclick="addTask()">Add</button>
      <button class="btn-cancel"  onclick="hideAddTask()">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
